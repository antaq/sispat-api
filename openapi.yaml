            - 1: Móvel
            - 2: Imóvel
          enum: [1, 2]
          example: 1
        tempo_de_utilizacao:
          type: integer
          description: Tempo acumulado de uso em anos.
          example: 5
        modalidade_exploracao:
          type: integer
          description: |
            Modalidade de exploração.
            - 1: Autoridade Portuária
            - 2: Arrendatário
          enum: [1, 2]
          example: 2
