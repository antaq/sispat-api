          type: string
          format: date
          description: Data da última avaliação (YYYY-MM-DD).
          example: "2024-01-15"
        valor_justo_de_mercado:
          type: string
          description: Valor justo de mercado.
          example: "1400000.00"
        conta_contabil:
          type: string
          description: Conta contábil.
          example: "1.2.3.1.1.01.01"
        valor_residual:
          type: string
          description: Valor residual.
          example: "150000.00"
        vida_util_anos:
          type: integer
          description: Vida útil em anos.
          example: 20
        taxa_depreciacao:
          type: number
          format: double
          description: Percentual anual de depreciação.
          example: 5.00
        conta_contabil_depreciacao:
          type: string
          description: Conta contábil da despesa de depreciação.
          example: "2.1.1.01.01"
        depreciacao_anual:
          type: number
          format: double
          readOnly: true
          description: |
            Valor monetário depreciado anualmente. **Calculado automaticamente** pelo sistema
            usando a fórmula: ((valor_original - valor_residual) / vida_util_anos) * (taxa_depreciacao / 100).
            Este campo é somente leitura e não pode ser enviado no corpo da requisição PUT.
          example: 75000.00
        depreciacao_especial:
          type: integer
          description: |
            Indica se possui depreciação especial.
            - 1: Sim
            - 2: Não
          enum: [1, 2]
          example: 2
        desc_deprec_especial:
          type: string
          description: |
            Justificativa para depreciação especial.
            **Obrigatório quando depreciacao_especial = 1 (Sim).**
          example: "Bem com vida útil reduzida devido ao uso intensivo."
        numero_registro_patrimonial_pai:
          type: string
          maxLength: 50
          nullable: true
          description: |
            Número de registro patrimonial do bem pai ao qual este bem está vinculado (opcional).
            Utilizado para vincular bens acessórios (filhos) a um bem principal (pai).

            **Regras de validação:**
            - O bem pai deve existir e pertencer ao mesmo CNPJ.
            - Não pode referenciar a si mesmo.
            - O bem pai não pode ser filho de outro bem (apenas um nível de hierarquia: pai → filho).
            - Um bem que já possui filhos vinculados não pode ser vinculado como filho de outro bem.

            Retorna `null` quando o bem não está vinculado a nenhum outro.
          example: "PAT-2024-0001"

