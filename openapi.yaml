            - 1: Próprio
            - 2: Tesouro Nacional
            - 3: Tesouro Estadual
            - 4: Tesouro Municipal
          enum: [1, 2, 3, 4]
          example: 1
        historico:
          type: integer
          description: |
            Status histórico do bem.
            - 1: Tombado
            - 2: Não Tombado
            - 3: Inexistente
            - 4: Transferência União
            - 5: Sem Transferência
            - 6: Com Aceite
            - 7: Sem Aceite
          enum: [1, 2, 3, 4, 5, 6, 7]
          example: 1
        situacao:
          type: integer
          description: |
            Situação atual do bem.
            - 1: Servível
            - 2: Ocioso
            - 3: Antieconômico
            - 4: Recuperável
            - 5: Irrecuperável
          enum: [1, 2, 3, 4, 5]
          example: 1
        estado_de_conservacao:
          type: integer
          description: |
            Estado de conservação do bem.
            - 1: Novo
            - 2: Excelente
            - 3: Bom
            - 4: Regular
            - 5: Péssimo
          enum: [1, 2, 3, 4, 5]
          example: 3
        bem_da_uniao:
          type: integer
          description: |
